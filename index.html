<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Қос қуаныш</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#C5A059;
  --gold-light:#DFBC7E;
  --gold-dark:#96743A;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#f8f8f8;
  font-family:'Montserrat',sans-serif;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.font-serif{
  font-family:'Cormorant Garamond',serif;
}

.mobile-container{
  width:100%;
  max-width:390px;
  min-height:100vh;
  background:white;
  position:relative;
  overflow-x:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.05);
}

.kazakh-pattern-bg{
  background-color:#fff;
  background-image:url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg stroke='%23C5A059' fill='none' stroke-width='0.4' opacity='0.25'%3E%3Cpath d='M60 60C45 60 40 45 40 30C40 15 50 15 55 30C60 45 60 60 55 60M60 60C75 60 80 45 80 30C80 15 70 15 65 30C60 45 60 60 65 60'/%3E%3Cpath d='M60 60C45 60 40 75 40 90C40 105 50 105 55 90C60 75 60 60 55 60M60 60C75 60 80 75 80 90C80 105 70 105 65 90C60 75 60 60 65 60'/%3E%3C/g%3E%3C/svg%3E");
}

.btn-gold{
  background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
  color:white;
  letter-spacing:1px;
}

.btn-outline-gold{
  border:1px solid var(--gold);
  color:var(--gold-dark);
  letter-spacing:1px;
}

.hidden{
  display:none!important;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.animate-fade-in{
  animation:fadeIn 1s ease forwards;
}

input::placeholder{
  color:#aaa;
}
</style>
</head>

<body>

<audio id="bg-music" loop preload="auto">
  <source src="./music.mp3" type="audio/mpeg">
</audio>

<button
  id="music-btn"
  onclick="toggleMusic()"
  class="fixed bottom-4 right-4 z-50 bg-[#C5A059] text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center">
  🔇
</button>
